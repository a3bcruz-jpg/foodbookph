name: FoodBookPH CI

on:
  pull_request:
  push:
    branches:
      - main
      - design/official-brand-ui-refresh
      - refactor/account-and-service-ratings

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foodbookph
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Prisma validate
        run: npx prisma validate
      - name: Production build
        run: npm run build
